name: Agent report
description: A report drafted by `shadowdroid feedback draft`, reviewed by you before submitting.
title: "[agent] "
labels: ["agent-report", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Your agent drafted this report with `shadowdroid feedback draft`. **Issues are public**: read the report below and remove anything private (hostnames, account names, app data) before you submit.
        To write a report yourself, use the [bug report](https://github.com/shadowdroid-dev/shadowdroid/issues/new?template=bug_report.yml) form instead.
  - type: input
    id: kind
    attributes:
      label: Kind
      description: bug, gap (something ShadowDroid can't do), friction, or docs.
      placeholder: bug
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Generated by the CLI. Keep the `shadowdroid-fingerprint` line; it groups duplicates.
    validations:
      required: true
  - type: checkboxes
    id: reviewed
    attributes:
      label: Review
      options:
        - label: I read this report and it contains nothing private.
          required: true
